               data-fa="یک نمونه عملی بر اساس تجربه عملیاتی در صنعت هوانوردی (حدود ۹ سال در عملیات کابین و مسئولیت‌های سرپرستی ارشد).">
                A practical demonstration based on operational experience in aviation (~9 years in cabin operations and senior cabin crew responsibilities).
