                <span class="px-3.5 py-2 rounded-lg bg-obsidian-800/80 border border-purple-900/50"><i class="fa-solid fa-list-check text-indigo-400 mr-2"></i>SOP & Audit Workflows</span>
                <span class="px-3.5 py-2 rounded-lg bg-obsidian-800/80 border border-purple-900/50"><i class="fa-solid fa-globe text-purple-400 mr-2"></i>Bilingual Systems (EN / FA)</span>
            </div>

