                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        },
                        obsidian: {
                            800: '#120f24',
                            900: '#090714',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Vazirmatn', 'sans-serif'],
                        fa: ['Vazirmatn', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js Library for Minimal Neuron Mesh Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            background-color: #090714;
            color: #f1f5f9;
            font-family: 'Inter', 'Vazirmatn', sans-serif;
            overflow-x: hidden;
        }

        #webgl-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* Glassmorphism Luxury Styles */
        .glass-panel {
            background: rgba(9, 7, 20, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.22);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-panel-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-panel-hover:hover {
            border-color: rgba(168, 85, 247, 0.55);
            box-shadow: 0 10px 40px -10px rgba(168, 85, 247, 0.35), 0 0 20px rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }

        .glass-card {
            background: rgba(18, 15, 36, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(18, 15, 36, 0.75);
        }

        /* Purple Aura Glow */
        #cursor-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(124, 58, 237, 0.05) 45%, rgba(0,0,0,0) 75%);
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        /* Purple Gradient Text */
        .purple-gradient-text {
            background: linear-gradient(135deg, #f3e8ff 0%, #c084fc 40%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090714;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1938;
            border-radius: 4px;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7;
        }

        /* Persian Alignment */
        .fa-mode {
            direction: rtl;
            font-family: 'Vazirmatn', sans-serif;
        }
    </style>
</head>
<body class="relative min-h-screen text-slate-200 selection:bg-purple-600 selection:text-white">

