                title_fa: "۰۲. بررسی و تطابق استاندارد",
                action_en: "Perform physical inspection against explicit acceptance criteria. Avoid ambiguous assumptions.",
                action_fa: "انجام بازرسی فیزیکی تطبیقی با معیارهای صریح پذیرش.",
                record_en: "Pass / Fail / Not Applicable Status Flag",
                record_fa: "ثبت وضعیت: قبول / رد / نامربوط",
                icon: "fa-magnifying-glass"
            },
            3: {
                title_en: "03. Real-Time Recordkeeping",
                title_fa: "۰۳. ثبت هم‌زمان سوابق",
                action_en: "Log check results immediately upon completion using standard nomenclature.",
                action_fa: "ثبت بلافاصله نتایج کنترل هم‌زمان با انجام کار.",
                record_en: "Precise Timestamp, Inspector Initials",
                record_fa: "زمان دقیق تکمیل و شناسه بازرس",
                icon: "fa-pen-to-square"
            },
            4: {
                title_en: "04. Exception Escalation",
                title_fa: "۰۴. ارجاع مغایرت‌ها",
                action_en: "Flag non-compliant items immediately. Initiate corrective action log without marking complete.",
                action_fa: "علامت‌گذاری موارد ردشده و ایجاد پرونده ارجاع تا رفع کامل مسئله.",
                record_en: "Deviation Report ID, Action Owner, Due Date",
                record_fa: "شرح مغایرت، مسئول پیگیری و مهلت اصلاح",
                icon: "fa-triangle-exclamation"
            },
            5: {
                title_en: "05. Supervisory Sign-Off",
                title_fa: "۰۵. بازبینی و تأیید سرپرستی",
                action_en: "Senior supervisor reviews log completeness, unresolved items, and signs off.",
                action_fa: "بازبینی و بازرسی نهایی توسط سرپرست ارشد و تأیید سوابق.",
                record_en: "Reviewer Signature, Closure Timestamp",
                record_fa: "امضای بازبین و زمان بسته‌شدن گزارش",
                icon: "fa-user-shield"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            ['en', 'dual', 'fa'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.className = "px-2.5 py-1 rounded transition-colors bg-purple-600 text-white font-bold";
                } else {
                    btn.className = "px-2.5 py-1 rounded transition-colors text-slate-400 hover:text-white";
                }
            });

            document.querySelectorAll('[data-en]').forEach(el => {
                if (lang === 'fa') {
                    el.innerText = el.getAttribute('data-fa');
                    el.classList.add('font-fa');
                } else if (lang === 'en') {
                    el.innerText = el.getAttribute('data-en');
                    el.classList.remove('font-fa');
                } else {
                    el.innerText = `${el.getAttribute('data-en')} | ${el.getAttribute('data-fa')}`;
                }
            });

            const s1Content = document.getElementById('section-01-content');
            if (lang === 'fa') {
                document.body.classList.add('fa-mode');
                if(s1Content) s1Content.classList.add('fa-mode');
            } else {
                document.body.classList.remove('fa-mode');
                if(s1Content) s1Content.classList.remove('fa-mode');
            }

            renderWorkflowStep();
            showToast(`Language set to ${lang.toUpperCase()}`);
        }

        function selectWorkflowStep(stepNum) {
            activeWorkflowStep = stepNum;
            document.querySelectorAll('.step-btn').forEach((btn, index) => {
                if (index + 1 === stepNum) {
                    btn.className = "step-btn p-4 rounded-xl glass-card text-left border border-purple-500/50 bg-purple-500/10 transition-all";
                } else {
                    btn.className = "step-btn p-4 rounded-xl glass-card text-left border border-purple-900/40 hover:border-purple-500/30 transition-all";
                }
            });

            renderWorkflowStep();
        }

        function renderWorkflowStep() {
            const step = workflowData[activeWorkflowStep];
            const container = document.getElementById('step-detail-container');
            
            const title = (currentLang === 'fa') ? step.title_fa : step.title_en;
            const action = (currentLang === 'fa') ? step.action_fa : step.action_en;
            const record = (currentLang === 'fa') ? step.record_fa : step.record_en;

            container.innerHTML = `
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/40 flex items-center justify-center text-purple-300 text-xl shadow-lg shadow-purple-500/10">
                        <i class="fa-solid ${step.icon}"></i>
                    </div>
                    <div>
                        <span class="text-xs font-mono text-purple-400 uppercase tracking-widest">Pipeline Step 0${activeWorkflowStep}</span>
                        <h3 class="text-xl font-bold text-white">${title}</h3>
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-6 text-xs pt-2">
                    <div class="bg-obsidian-900/80 p-4 rounded-xl border border-purple-900/40 backdrop-blur-md">
                        <span class="text-slate-400 uppercase tracking-wider text-[10px] font-mono block mb-1">Action Protocol / اقدام</span>
                        <p class="text-slate-200 leading-relaxed">${action}</p>
                    </div>
                    <div class="bg-obsidian-900/80 p-4 rounded-xl border border-purple-900/40 backdrop-blur-md">
                        <span class="text-slate-400 uppercase tracking-wider text-[10px] font-mono block mb-1">Required Control Record / ثبت</span>
                        <p class="text-purple-300 font-mono leading-relaxed">${record}</p>
                    </div>
                </div>
            `;
        }

        function renderChecklistTable() {
            const tbody = document.getElementById('checklist-table-body');
            tbody.innerHTML = '';

            const filtered = checklistData.filter(item => {
                if (checklistFilter === 'FAIL') return item.status === 'FAIL';
                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-500">No check items found for this filter.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-obsidian-800/40 transition-colors";

                let statusBadge = '';
                if (item.status === 'PASS') {
                    statusBadge = `<span class="px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold font-mono">PASS</span>`;
                } else if (item.status === 'FAIL') {
                    statusBadge = `<span class="px-2 py-1 rounded bg-red-950 text-red-400 border border-red-800 font-bold font-mono">FAIL</span>`;
                } else {
                    statusBadge = `<span class="px-2 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700 font-bold font-mono">N/A</span>`;
                }

                tr.innerHTML = `
                    <td class="p-4">
                        <div class="font-bold text-white">${item.title}</div>
                        <div class="text-[11px] text-slate-400">${item.criteria}</div>
                    </td>
                    <td class="p-4">
                        <div class="flex items-center gap-1">
                            <button onclick="updateCheckStatus(${item.id}, 'PASS')" class="p-1 hover:text-emerald-400 ${item.status === 'PASS' ? 'text-emerald-400' : 'text-slate-600'}"><i class="fa-solid fa-circle-check"></i></button>
                            <button onclick="updateCheckStatus(${item.id}, 'FAIL')" class="p-1 hover:text-red-400 ${item.status === 'FAIL' ? 'text-red-400' : 'text-slate-600'}"><i class="fa-solid fa-circle-xmark"></i></button>
                            <button onclick="updateCheckStatus(${item.id}, 'N/A')" class="p-1 hover:text-slate-300 ${item.status === 'N/A' ? 'text-slate-300' : 'text-slate-600'}"><i class="fa-solid fa-ban"></i></button>
                            <span class="ml-2">${statusBadge}</span>
                        </div>
                    </td>
                    <td class="p-4 text-slate-300">
                        <input type="text" value="${item.notes}" onchange="updateCheckNotes(${item.id}, this.value)" class="bg-obsidian-900 border border-purple-900/60 rounded px-2 py-1 text-xs w-full text-slate-300 focus:border-purple-500">
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="deleteCheckItem(${item.id})" class="text-slate-500 hover:text-red-400 p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateCheckStatus(id, newStatus) {
            const item = checklistData.find(i => i.id === id);
            if (item) {
                item.status = newStatus;
                renderChecklistTable();
                showToast(`Item #${id} updated to ${newStatus}`);
            }
        }

        function updateCheckNotes(id, text) {
            const item = checklistData.find(i => i.id === id);
            if (item) {
                item.notes = text;
                showToast(`Notes updated for Item #${id}`);
            }
        }

        function addCustomCheckItem() {
            const titleInput = document.getElementById('new-item-title');
            const criteriaInput = document.getElementById('new-item-criteria');

            if (!titleInput.value.trim()) {
                showToast('Please enter a check item title.', 'error');
                return;
            }

            const newItem = {
                id: Date.now(),
                title: titleInput.value.trim(),
                criteria: criteriaInput.value.trim() || 'Standard operational parameters',
                status: 'PASS',
                notes: 'Custom inspection record created.'
            };

            checklistData.push(newItem);
            titleInput.value = '';
            criteriaInput.value = '';
            renderChecklistTable();
            showToast('New Check Item added.');
        }

        function deleteCheckItem(id) {
            checklistData = checklistData.filter(i => i.id !== id);
            renderChecklistTable();
            showToast('Check Item deleted.');
        }

        function filterChecklist(filter) {
            checklistFilter = filter;
            renderChecklistTable();
            showToast(`Filter applied: ${filter}`);
        }

        function exportChecklistCSV() {
            let csv = "ID,Check Item,Acceptance Criteria,Status,Exception Notes\n";
            checklistData.forEach(i => {
                csv += `"${i.id}","${i.title}","${i.criteria}","${i.status}","${i.notes}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Audit_Report_AyehVega_${Date.now()}.csv`);
            a.click();
            showToast('CSV Report Downloaded');
        }

        function copyChecklistReport() {
            let summary = `OPERATIONAL AUDIT SUMMARY - www.ayehvega.ir\nDate: ${new Date().toLocaleDateString()}\n\n`;
            checklistData.forEach(i => {
                summary += `[${i.status}] ${i.title} - ${i.notes}\n`;
            });
            copyToClipboard(summary);
        }

        let currentDepth = 'standard';

        function setDepth(depth) {
            currentDepth = depth;
            ['standard', 'detailed', 'enterprise'].forEach(d => {
                const btn = document.getElementById(`depth-${d}`);
                if (d === depth) {
                    btn.className = "p-2.5 rounded-lg glass-card border border-purple-500/50 bg-purple-500/10 text-white font-semibold";
                } else {
                    btn.className = "p-2.5 rounded-lg glass-card border border-purple-900/40 text-slate-400 hover:text-white";
                }
            });
            calculateScope();
        }

        function calculateScope() {
            const workflows = parseInt(document.getElementById('input-workflows').value);
            document.getElementById('val-workflows').innerText = `${workflows} Workflow${workflows > 1 ? 's' : ''}`;

            const hasTraining = document.getElementById('check-training').checked;
            const hasExcel = document.getElementById('check-excel').checked;

            let baseDays = workflows * 2;
            if (currentDepth === 'detailed') baseDays += 3;
            if (currentDepth === 'enterprise') baseDays += 6;
            if (hasTraining) baseDays += 3;
            if (hasExcel) baseDays += 2;

            document.getElementById('res-timeline').innerText = `${baseDays} - ${baseDays + 3} Business Days`;
            document.getElementById('res-reviews').innerText = currentDepth === 'enterprise' ? '3 Iteration Cycles' : '2 Iteration Cycles';
            
            let formatText = "PDF SOP";
            if (hasExcel) formatText += " + Custom Excel Tracker";
            if (hasTraining) formatText += " + Training Deck";
            document.getElementById('res-format').innerText = formatText;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
            showToast('Copied to Clipboard!');
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = msg;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function prefillContactSubject() {
            const workflows = document.getElementById('input-workflows').value;
            document.getElementById('form-subject').value = `Inquiry: ${workflows} Workflow Documentation Project`;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('form-name').value;
            const subject = document.getElementById('form-subject').value;
            const msg = document.getElementById('form-message').value;

            const mailtoUrl = `mailto:ayehsadeghi9@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent("Name: " + name + "\n\nMessage:\n" + msg)}`;
            window.location.href = mailtoUrl;

            showToast('Opening email client...');
        }

        window.onload = function() {
            initMinimalNeuronBackground();
            selectWorkflowStep(1);
            renderChecklistTable();
            calculateScope();
        };
    </script>
