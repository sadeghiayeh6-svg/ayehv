            <!-- Mobile Menu Dropdown -->
            <div id="mobile-menu" class="hidden md:hidden pt-4 pb-2 border-t border-purple-900/40 mt-3 space-y-2 text-xs">
                <a href="#section-01" class="block py-2 text-slate-300 hover:text-purple-400">01. Context & Objective</a>
                <a href="#section-02" class="block py-2 text-slate-300 hover:text-purple-400">02. Proposed Workflow</a>
                <a href="#section-03" class="block py-2 text-slate-300 hover:text-purple-400">03. Checklist Template</a>
