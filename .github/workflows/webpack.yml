            { id: 4, title: 'Pre-Flight Briefing Log', criteria: 'All crew signatures present with timestamp', status: 'PASS', notes: 'Logged by Senior Crew.' }
        ];

        const workflowData = {
            1: {
                title_en: "01. Prepare & Briefing",
                title_fa: "۰۱. آماده‌سازی و بریفینگ",
                action_en: "Open approved checklist ID, confirm scope of task, and verify cabin zone responsibility.",
                action_fa: "بازکردن چک‌لیست معتبر، تأیید محدوده مسئولیت و حوزه‌های کابین.",
                record_en: "Checklist Unique ID, Execution Date, Assigned Staff ID",
                record_fa: "شناسه یکتای چک‌لیست، تاریخ، شناسه مسئول",
                icon: "fa-folder-open"
            },
            2: {
