    <script>
        let scene, camera, renderer;
        let particles, linesMesh;
        let particlePositions, particleVelocities;
        const maxParticleCount = 180;
        const maxDistance = 14;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        function initMinimalNeuronBackground() {
            const canvas = document.getElementById('webgl-bg');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x090714, 0.012);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Neural Network Particles Geometry
            const particleGeometry = new THREE.BufferGeometry();
            particlePositions = new Float32Array(maxParticleCount * 3);
            particleVelocities = [];

            for (let i = 0; i < maxParticleCount; i++) {
                const x = (Math.random() - 0.5) * 90;
                const y = (Math.random() - 0.5) * 90;
                const z = (Math.random() - 0.5) * 90;

                particlePositions[i * 3] = x;
                particlePositions[i * 3 + 1] = y;
                particlePositions[i * 3 + 2] = z;

                particleVelocities.push({
                    x: (Math.random() - 0.5) * 0.04,
                    y: (Math.random() - 0.5) * 0.04,
                    z: (Math.random() - 0.5) * 0.04
                });
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3).setUsage(THREE.DynamicDrawUsage));

            // Purple Neuron Point Nodes
            const pMaterial = new THREE.PointsMaterial({
                color: 0xc084fc,
                size: 1.4,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(particleGeometry, pMaterial);
            scene.add(particles);

            // Neural Connections (Synapses) Lines
            const linesGeometry = new THREE.BufferGeometry();
            const linesMaterial = new THREE.LineSegmentsMaterial ? new THREE.LineBasicMaterial({
                color: 0x8b5cf6,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending
            }) : new THREE.LineBasicMaterial({
                color: 0x8b5cf6,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending
            });

            linesMesh = new THREE.LineSegments(linesGeometry, linesMaterial);
            scene.add(linesMesh);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);

            animateNeurons();
        }

        function onMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.03;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.03;

            const cursorGlow = document.getElementById('cursor-glow');
            if (cursorGlow) {
                cursorGlow.style.left = event.clientX + 'px';
                cursorGlow.style.top = event.clientY + 'px';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animateNeurons() {
            requestAnimationFrame(animateNeurons);

            targetX += (mouseX - targetX) * 0.04;
            targetY += (mouseY - targetY) * 0.04;

            camera.position.x += (targetX - camera.position.x) * 0.02;
            camera.position.y += (-targetY - camera.position.y) * 0.02;
            camera.lookAt(scene.position);

            let linePos = [];
            const positions = particles.geometry.attributes.position.array;

            // Move Neural Nodes
            for (let i = 0; i < maxParticleCount; i++) {
                positions[i * 3] += particleVelocities[i].x;
                positions[i * 3 + 1] += particleVelocities[i].y;
                positions[i * 3 + 2] += particleVelocities[i].z;

                if (Math.abs(positions[i * 3]) > 55) particleVelocities[i].x *= -1;
                if (Math.abs(positions[i * 3 + 1]) > 55) particleVelocities[i].y *= -1;
                if (Math.abs(positions[i * 3 + 2]) > 55) particleVelocities[i].z *= -1;
            }

            // Connect nearby nodes with synaptic lines
            for (let i = 0; i < maxParticleCount; i++) {
                for (let j = i + 1; j < maxParticleCount; j++) {
                    const dx = positions[i * 3] - positions[j * 3];
                    const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
                    const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (dist < maxDistance) {
                        linePos.push(
                            positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2],
                            positions[j * 3], positions[j * 3 + 1], positions[j * 3 + 2]
                        );
                    }
                }
            }

            particles.geometry.attributes.position.needsUpdate = true;

            linesMesh.geometry.dispose();
            linesMesh.geometry = new THREE.BufferGeometry();
            linesMesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));

            renderer.render(scene, camera);
        }

        let currentLang = 'en';
        let activeWorkflowStep = 1;
        let checklistFilter = 'ALL';
        
        let checklistData = [
            { id: 1, title: 'Emergency Equipment Seals', criteria: 'Tamper-evident seals intact and verified active', status: 'PASS', notes: 'All 4 cabin zones verified.' },
